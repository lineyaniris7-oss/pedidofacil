<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Registro</title>

</head>

<body>

<h1>Crear cuenta</h1>

{% if error %}
    <p style="color: red;">
        {{ error }}
    </p>
{% endif %}

<form method="POST">

    {% csrf_token %}

    <p>
        <label>Usuario:</label><br>

        <input
            type="text"
            name="username"
            required
        >
    </p>

    <p>
        <label>Correo:</label><br>

        <input
            type="email"
            name="email"
            required
        >
    </p>

    <p>
        <label>Contraseña:</label><br>

        <input
            type="password"
            name="password1"
            required
        >
    </p>

    <p>
        <label>Repetir contraseña:</label><br>

        <input
            type="password"
            name="password2"
            required
        >
    </p>

    <button type="submit">
        Registrarme
    </button>

</form>

<br>

<a href="/usuarios/login/">
    ¿Ya tienes cuenta? Inicia sesión
</a>

</body>

</html>
